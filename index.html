<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tip % Bill</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>

    <div class="card">
      <h1>Tip & Bill</h1>

      <label>Bill Amount</label>
      <input type="number" id="bill" placeholder="Enter bill amount">

      <label>Tip Percentage (%)</label>
      <input type="number" id="tip" placeholder="Enter tip %">

      <label>Number Of People</label>
      <input type="number" id="people" placeholder="enter people">

      <button id="calculateBtn">Calculate</button>

      <div class="result">
        <p>Each Person Pays</p>
        <h2 id="result">₱0.00</h2>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
